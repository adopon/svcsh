# Example: a stack with a single service.
#
# The directory name is the stack name: ./svc.sh up example-single
services:
  example-single:
    image: nginx:alpine
    container_name: example-single
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      # Secrets/config come from this stack's .env (see .env.example)
      EXAMPLE_SECRET: ${EXAMPLE_SECRET}
    ports:
      # Host side from ../ports.env, container side fixed
      - "${EXAMPLE_SINGLE_PORT}:80"
    # Persistent service data lives on the SSD, keyed by service name:
    # volumes:
    #   - ${HOMELAB_SERVICE_DATA_PATH}/example-single:/data
    networks:
      - homelab-network

networks:
  homelab-network:
    external: true
